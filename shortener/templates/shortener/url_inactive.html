{% extends 'shortener/base.html' %}

{% block title %}URL Inactive{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6 text-center mt-5">
            <div class="card shadow-sm">
                <div class="card-body p-5">
                    <i class="bi bi-x-circle text-secondary" style="font-size: 5rem;"></i>
                    <h2 class="mt-4 mb-3">URL Inactive</h2>
                    <p class="text-muted mb-4">
                        This short URL has been deactivated by its owner.
                    </p>
                    <a href="{% url 'shortener:home' %}" class="btn btn-primary">
                        <i class="bi bi-house"></i> Go to Home
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
